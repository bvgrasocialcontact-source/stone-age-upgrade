  const camAt = t => { let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++; const a = K[i], b = K[i + 1], k = p(t, a[0], b[0], E.inOut); return [lerp(a[1], b[1], k), lerp(a[2], b[2], k), lerp(a[3], b[3], k)]; };
  const win = (t, a, b, fi = .25, fo = .25) => p(t, a, a + fi, E.out) * (1 - p(t, b - fo, b, E.in));
  const clr = g => { while (g.firstChild) g.removeChild(g.firstChild); };

      // cousin: walks to the pit 78.4–81.6, drops stone, boom 82.2

      const cExpr = t > 82.2 && t < 95 ? 'shock' : t > 13.7 && t < 16.3 ? 'shock' : t > 176 && t < 184 ? 'smile' : 'neutral';
      cousin.pose({ x: X.cousin - cw * 120 + cBack * 60, y: GY, scale: CS, expr: cExpr, bob: bob(2) + (t > 82.2 && t < 83 ? -30 * Math.sin(p(t, 82.2, 83, E.linear) * Math.PI) : 0), armL: t > 81 && t < 82.2 ? 60 : (t > 82.2 && t < 86 ? 150 : 0), armR: t > 82.2 && t < 86 ? 150 : 0, look: [-14, 6], legL: cw > 0 && cw < 1 ? Math.sin(t * 9) * 14 : 0, legR: cw > 0 && cw < 1 ? -Math.sin(t * 9) * 14 : 0 }, t);

      const blink = [3.4, 14.9, 26.1, 40.2, 57.4, 75.2, 99.8, 113.6, 131.0, 158.4, 171.3, 188.1].some(b => t > b && t < b + .09);

      if (t > 145.5 && t < 151) [[-60, -440], [50, -470], [10, -360], [-30, -380], [70, -400]].forEach(([dx, dy], i) => el('circle', { cx: X.you + dx * CS, cy: GY + dy * CS, r: (18 + i * 3) * CS * p(t, 145.5, 145.8, E.back), fill: '#E06A5A', stroke: B.ink, 'stroke-width': 2.5 }, fx));

      set(gaz, { display: t > 54.6 && t < 60.2 ? 'inline' : 'none', transform: `translate(${lerp(W * 1.1, W * .6, gk) + gOut * W * .6},${GY - 10 - Math.abs(Math.sin(t * 8)) * (gk < 1 || gOut > 0 ? 8 : 0)}) scale(${.75})` });

      if (t > 152 && t < 176) for (let i = 0; i < 7; i++) {
        const st = 153 + i * 2.2, k = (t - st) / 5;
        if (k < 0 || k > 1) continue;

      const counted = t < 153 ? 0 : Math.min(24, [0, 1, 2, 3, 4, 5, 6].filter(i => t > 153 + i * 2.2 + 2.5).length + Math.max(0, Math.floor((t - 168) * 1.6)));

      boil(ost, (r, s, g) => SAU.drawOstrich(SAU.makePen(1, r, g, { seed: s, sw: 4 })), t, .083);
      set(ost, { display: t > 190.9 && t < 192.8 ? 'inline' : 'none', transform: `translate(${lerp(W * 1.1, -W * .2, ok2)},${GY + 20 - Math.abs(Math.sin(t * 18)) * 16}) rotate(${Math.sin(t * 18) * 3}) scale(.85)` });

      // ---------- kids (child survival) 108–122.7 ----------
      clr(kids);
      if (t > 108 && t < 122.8) {
        const kin = p(t, 108, 108.6, E.out), kout = 1 - p(t, 122.3, 122.8);
        for (let i = 0; i < 10; i++) {
          const lost = [1, 3, 4, 7].includes(i);
          const fade = lost ? 1 - p(t, 111 + i * .25, 112.5 + i * .25) * (1 - p(t, 119, 120)) * .85 : 1;

      const dv = win(t, 51.6, 59.9, .3, .3);
      set(canvasG, { display: dv > 0 ? 'inline' : 'none', opacity: dv, transform: `translate(${W - 800},${650})` });
      if (dv > 0) {

        const pen = (d, a, len = 900) => { const k = p(t, a, a + .7, E.out); el('path', { d, stroke: CL.orange, 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'stroke-dasharray': len, 'stroke-dashoffset': len * (1 - k) }, doodle); };

        pen('M 470 150 Q 540 120 610 152 Q 640 175 600 200 Q 530 214 480 196 Q 450 180 470 150 M 490 196 L 482 262 M 520 204 L 528 266 M 572 204 L 566 262 M 598 196 L 612 258 M 474 156 L 440 96 Q 430 80 416 92 L 402 110 M 438 92 L 420 52 M 448 90 L 452 46', 53.56, 1400);
        if (t > 54.2) el('text', { x: 700, y: 300, 'text-anchor': 'end', fill: CL.orangeDeep, 'font-family': CL.serif, 'font-style': 'italic', 'font-size': 30 }, doodle).textContent = '(a gazelle)';
      }

      const dimK = Math.max(win(t, 17.3, 29.3) * .45, win(t, 70.2, 78.1) * .55, win(t, 95.6, 105.8) * .6, win(t, 154.5, 175.6) * .25, win(t, 68.6, 70.2) * .45);

        clr(tabletTxt);
        const line = (y, txt, a, strike) => { if (t < a) return; const k = p(t, a, a + .3); el('text', { x: -390, y, fill: '#2B2420', 'font-family': '"Comic Relief"', 'font-weight': 700, 'font-size': 50, opacity: k }, tabletTxt).textContent = txt; if (t > strike) { const s2 = p(t, strike, strike + .25); el('path', { d: `M -400 ${y - 16} L ${-400 + 820 * s2} ${y - 10}`, stroke: '#C8231E', 'stroke-width': 10, 'stroke-linecap': 'round' }, tabletTxt); } };
        if (t > 17.8) el('text', { x: 0, y: -170, 'text-anchor': 'middle', fill: '#2B2420', 'font-family': B.fontDisplay, 'font-size': 58 }, tabletTxt).textContent = 'MEETING #1';

      }
      // dictionary cards 34.6–44.8
      clr(cards);
      if (t > 34.6 && t < 44.9) {
        const out = 1 - p(t, 44.5, 44.9);
        const n = t < 36.8 ? 1 : t < 38.9 ? 2 : Math.min(WORDS.length, 2 + Math.floor((t - 38.9) * 3));
        for (let i = 0; i < n; i++) {
          const k = p(t, i === 0 ? 34.6 : i === 1 ? 36.8 : 38.9 + (i - 2) / 3, (i === 0 ? 34.6 : i === 1 ? 36.8 : 38.9 + (i - 2) / 3) + .3, E.back);
          const col = i % 4, row = Math.floor(i / 4);
          const g = el('g', { transform: `translate(${W - 860 + col * 205},${300 + row * 170}) rotate(${(hash(i) - .5) * 8}) scale(${k})`, opacity: out }, cards);
          el('rect', { x: -90, y: -60, width: 180, height: 120, rx: 12, fill: CL.cream, stroke: CL.orange, 'stroke-width': 3 }, g);
          el('text', { x: 0, y: -6, 'text-anchor': 'middle', fill: CL.dark, 'font-family': CL.serif, 'font-weight': 700, 'font-size': 40 }, g).textContent = '"' + WORDS[i][1] + '"';
          el('text', { x: 0, y: 38, 'text-anchor': 'middle', fill: CL.orangeDeep, 'font-family': CL.sans, 'font-weight': 500, 'font-size': 24 }, g).textContent = '= ' + WORDS[i][0];
        }
        if (t > 39.9) { const k = p(t, 39.9, 40.3, E.back); const g = el('g', { transform: `translate(${W - 550},${700}) scale(${k})`, opacity: out }, cards); el('rect', { x: -260, y: -90, width: 520, height: 180, rx: 14, fill: '#9C6B44', stroke: B.ink, 'stroke-width': 5 }, g); el('text', { x: 0, y: -14, 'text-anchor': 'middle', fill: B.bone, 'font-family': B.fontDisplay, 'font-size': 46 }, g).textContent = 'DICTIONARY v0.1'; el('text', { x: 0, y: 44, 'text-anchor': 'middle', fill: B.sand, 'font-family': '"Comic Relief"', 'font-weight': 700, 'font-size': 34 }, g).textContent = t > 43.1 ? 'by: You (only author)' : 'by: …'; }
      }
      // big card: BOIL YOUR WATER 68.7–70.1 / spear crossed 65.5–68.6
      clr(bigBg);
      if (t > 65.5 && t < 68.6) { const k = p(t, 65.5, 65.8, E.back); bigT.textContent = ''; const g = el('g', { transform: `scale(${k})` }, bigBg); g.appendChild(rc.line(-260, 60, 260, -60, { seed: 3, stroke: '#6B4A33', strokeWidth: 14 })); g.appendChild(rc.polygon([[260, -60], [210, -80], [228, -38]], { seed: 4, fill: '#8F857A', fillStyle: 'solid', stroke: B.ink, strokeWidth: 3 })); if (t > 66.4) { g.appendChild(rc.circle(0, 0, 420, { seed: 5, stroke: '#E0402E', strokeWidth: 16 })); g.appendChild(rc.line(-150, 150, 150, -150, { seed: 6, stroke: '#E0402E', strokeWidth: 16 })); } set(big, { display: 'inline', opacity: 1 - p(t, 68.3, 68.6), transform: `translate(${W * .5},${H * .42})` }); }
      else if (t > 68.65 && t < 70.2) { const k = p(t, 68.65, 68.95, E.back); bigT.textContent = 'Boil your water.'; const bw = 900; bigBg.appendChild(rc.rectangle(-bw / 2, -90, bw, 170, { seed: 7, fill: CL.cream, fillStyle: 'solid', stroke: CL.orange, strokeWidth: 6, roughness: .8 })); set(big, { display: 'inline', opacity: 1 - p(t, 69.9, 70.2), transform: `translate(${W * .5},${H * .42}) scale(${k})` }); }
      else { bigT.textContent = ''; set(big, { display: 'none' }); }
      // diagram 70.2–78.1 (Claude doodle style)
      clr(diag);
      const dk = win(t, 70.2, 78.1, .3, .3);
      if (dk > 0) {
        set(diag, { opacity: dk });
        el('rect', { x: 160, y: 200, width: W - 320, height: 640, rx: 24, fill: CL.cream, stroke: CL.orange, 'stroke-width': 5 }, diag);
        el('text', { x: W / 2, y: 270, 'text-anchor': 'middle', fill: CL.dark, 'font-family': CL.serif, 'font-weight': 700, 'font-size': 52 }, diag).textContent = 'How to boil water without a pot';
        const steps = [[72.9, 'dig a hole'], [73.8, 'line it with hide'], [75.3, 'fill with water'], [76.3, 'drop in hot stones']];
        steps.forEach(([a, label], i) => {
          if (t < a) return; const k = p(t, a, a + .35, E.back), x0 = 230 + i * 375, y0 = 330;
          const g = el('g', { transform: `translate(${x0},${y0}) scale(${k})` }, diag);
          el('rect', { width: 330, height: 330, rx: 18, fill: '#FFFFFF', stroke: CL.line, 'stroke-width': 3 }, g);
          el('text', { x: 24, y: 52, fill: CL.orange, 'font-family': CL.sans, 'font-weight': 700, 'font-size': 40 }, g).textContent = (i + 1) + '';
          const o = { stroke: CL.orange, 'stroke-width': 6, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
          el('path', Object.assign({ d: 'M 40 200 Q 165 300 290 200' }, o), g);
          if (i >= 1) el('path', Object.assign({ d: 'M 56 206 Q 165 284 274 206', 'stroke-dasharray': '10 10' }, o), g);
          if (i >= 2) el('path', { d: 'M 64 212 Q 165 280 266 212 Z', fill: '#9AC2D0', opacity: .8 }, g);
          if (i === 3) { [[120, 150], [170, 120], [215, 160]].forEach(([x, y]) => el('circle', Object.assign({ cx: x, cy: y + (t - a) * 30 % 60, r: 22 }, o, { fill: '#8F857A' }), g)); el('path', Object.assign({ d: 'M 140 110 q 10 -20 0 -40 M 190 90 q 10 -20 0 -40' }, o), g); }
          el('text', { x: 165, y: 300, 'text-anchor': 'middle', fill: CL.dark, 'font-family': CL.serif, 'font-weight': 600, 'font-size': 32 }, g).textContent = label;
        });
      } else set(diag, { opacity: 0 });
      // Claude note 85.9–90.2
      const nk = win(t, 85.9, 90.2, .35, .3);
      set(note.g, { display: nk > 0 ? 'inline' : 'none', opacity: nk, transform: `translate(${W - 640},${240 + (1 - nk) * 40}) rotate(2)` });
      // soap 95.6–105.8
      clr(soap);
      if (t > 95.6 && t < 105.8) {
        const so = 1 - p(t, 105.4, 105.8);
        const bi = p(t, 95.6, 95.95, E.out);
        el('rect', { x: 160, y: 230, width: W - 320, height: 590, rx: 24, fill: CL.cream, stroke: CL.orange, 'stroke-width': 5, opacity: so * bi }, soap);
        el('text', { x: W / 2, y: 302, 'text-anchor': 'middle', fill: CL.dark, 'font-family': CL.serif, 'font-weight': 700, 'font-size': 52, opacity: so * bi }, soap).textContent = 'Soap, Stone Age edition';
        const item = (x, a, draw, label) => { if (t < a) return; const k = p(t, a, a + .3, E.back); const g = el('g', { transform: `translate(${x},${H * .44}) scale(${k * 1.3})`, opacity: so }, soap); draw(g); el('text', { y: 140, 'text-anchor': 'middle', fill: CL.dark, 'font-family': CL.serif, 'font-weight': 600, 'font-size': 34 }, g).textContent = label; };
        const plus = (x, a) => { if (t > a) el('text', { x, y: H * .44 + 30, 'text-anchor': 'middle', fill: CL.orange, 'font-family': B.fontDisplay, 'font-size': 90, opacity: so }, soap).textContent = '+'; };
        item(W * .26, 97.0, g => g.appendChild(rc.ellipse(0, 20, 200, 90, { seed: 8, fill: '#9A948A', fillStyle: 'solid', stroke: B.ink, strokeWidth: 3 })), 'ash');
        plus(W * .38, 98.1);
        item(W * .5, 98.1, g => g.appendChild(rc.rectangle(-80, -40, 160, 100, { seed: 9, fill: '#F2E2B8', fillStyle: 'solid', stroke: B.ink, strokeWidth: 3 })), 'animal fat');
        plus(W * .62, 99.3);
        item(W * .74, 99.3, g => { g.appendChild(rc.polygon([[-60, -80], [60, -80], [0, 0]], { seed: 10, fill: '#F2C27F', fillStyle: 'solid', stroke: B.ink, strokeWidth: 3 })); g.appendChild(rc.polygon([[-60, 80], [60, 80], [0, 0]], { seed: 11, fill: '#F2C27F', fillStyle: 'solid', stroke: B.ink, strokeWidth: 3 })); }, 'a lot of patience');
        if (t > 100.6) { const k = p(t, 100.6, 101.0, E.back); const sx = t < 101.6 ? W * .5 : lerp(W * .5, W * 1.2, p(t, 101.6, 102.6, E.in)), sy = t < 101.6 ? 735 : 735 - Math.sin(p(t, 101.6, 102.6) * Math.PI) * 360; const g = el('g', { transform: `translate(${sx},${sy}) rotate(${t > 101.6 ? (t - 101.6) * 700 : 0}) scale(${k})`, opacity: so }, soap); g.appendChild(rc.rectangle(-90, -45, 180, 90, { seed: 12, fill: '#F7F1E1', fillStyle: 'solid', stroke: B.ink, strokeWidth: 4 })); for (let i = 0; i < 3; i++) el('circle', { cx: -40 + i * 40, cy: -60 - (t * 40 + i * 20) % 50, r: 12, fill: '#FFFFFF', stroke: '#9AC2D0', 'stroke-width': 3 }, g); }
        if (t > 104.1) { const k = p(t, 104.1, 104.4, E.back); const g = el('g', { transform: `translate(${W * .66},${H * .87}) scale(${k})`, opacity: so }, soap); el('rect', { x: -330, y: -56, width: 660, height: 112, rx: 14, fill: '#2A1C15', opacity: .94 }, g); el('text', { x: 0, y: 16, 'text-anchor': 'middle', fill: B.bone, 'font-family': B.fontMono, 'font-weight': 700, 'font-size': 44 }, g).textContent = 'STOMACH ACHES: ' + Math.max(0, Math.round(12 * (1 - p(t, 104.3, 105.2)))); }
      }
      // honey pot 134.6–139.4
      const hk = win(t, 134.6, 139.4, .3, .3);
      boil(honeyArt, (r, s, g) => SAU.drawHoney(r, s, g), t, .125);
      set(honey, { display: hk > 0 ? 'inline' : 'none', opacity: hk, transform: `translate(${W - 360},${H * .72}) scale(${1.1 * (.6 + .4 * hk)})` });
      // tally bone 159.4–175.7
      const bnk = win(t, 159.4, 175.7, .35, .3);
      boil(boneArt, (r, s, g) => SAU.drawTallyBone(r, s, g, counted, 620), t, .125);
      set(bone, { display: bnk > 0 ? 'inline' : 'none', opacity: bnk, transform: `translate(${W * .36},${H * .62}) rotate(-4)` });
      const ek = win(t, 172.2, 175.7, .3, .3);
      set(early, { display: ek > 0 ? 'inline' : 'none', opacity: ek, transform: `translate(${W * .5},${H * .34}) scale(${.8 + .2 * p(t, 172.2, 172.5, E.back)})` });
      earlyT.textContent = '+' + fmt(lerp(0, 250000, p(t, 172.4, 175.0, E.out))) + ' YRS EARLY';
      // year-one banner 180–184.5
      const bk2 = win(t, 180.1, 184.5, .35, .3);
      boil(bannerArt, (r, s, g) => g.appendChild(r.path('M -560 -60 L 560 -60 L 520 0 L 560 60 L -560 60 L -520 0 Z', { seed: s, fill: '#C8956A', fillStyle: 'solid', stroke: B.ink, strokeWidth: 5 })), t, .125);
      set(banner, { display: bk2 > 0 ? 'inline' : 'none', opacity: bk2, transform: `translate(${W / 2},${H * .3}) scale(${.6 + .4 * p(t, 180.1, 180.5, E.back)})` });

      // facts
      FACTS.forEach(f => { const k = p(t, f.a, f.a + .35, E.back) * (1 - p(t, f.b - .3, f.b, E.in)); set(f.g, { display: k > 0 ? 'inline' : 'none', transform: `translate(40,${H - 132 + (1 - k) * 180})`, opacity: clamp(k * 2) }); });

      // HUD
      const tags = [[0, 'DAY 1'], [16.85, 'DAY 2'], [38.9, 'DAY 5'], [60.4, 'DAY 6'], [95.3, 'WEEK 3'], [123.4, 'MONTH 2'], [150.8, 'MONTH 4'], [175.8, 'YEAR 1']];
      const tg = tags.filter(x => t >= x[0]).pop()[1];
      yp.set(t < 175.8 ? '300,000 BC' : (t < 176.6 ? (Math.floor(t * 20) % 2 ? '300,000 BC' : '299,999 BC') : '299,999 BC'), tg);
      const pop = t < 176.85 ? 30 : Math.round(lerp(30, 36, p(t, 176.85, 178.0)));
      stats.set(0, String(pop), t > 176.85 && t < 179 ? B.tech : B.bone);
      const words = t < 34.6 ? 0 : t < 39.0 ? (t < 36.8 ? 1 : 2) : t < 42.8 ? Math.round(lerp(2, 148, p(t, 39, 42.8, E.in))) : Math.round(148 + (t - 42.8) * 3.2);
      stats.set(1, t < 34.6 ? '—' : fmt(words), t > 39 && t < 43 ? B.tech : B.bone);
      const kidsPct = t < 108.2 ? null : t < 119 ? 57 : Math.round(lerp(57, 79, p(t, 119, 122, E.out)));
      stats.set(2, kidsPct == null ? '?' : '~' + kidsPct + '%', kidsPct == null ? B.bone : kidsPct < 60 ? '#FF7A3D' : '#7CF29A');
      set(hud, { opacity: 1 - dimK * .6 });

      set(flash, { opacity: t > 82.2 ? (1 - p(t, 82.2, 82.5)) * .8 : 0 });
    },
  };
