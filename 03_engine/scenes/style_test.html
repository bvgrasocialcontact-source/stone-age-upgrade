<!doctype html><html><head>
<link rel="stylesheet" href="../fonts/fonts.css"><meta charset="utf-8">
<style>html,body{margin:0;background:#1E1612;overflow:hidden}svg{display:block}</style>
<script src="../vendor/rough.js"></script>
<script src="../lib/sau.js"></script><script src="../lib/pen.js"></script><script src="../lib/characters.js"></script>
</head><body><script>
const STYLE = +(new URLSearchParams(location.search).get('style') || 1);
SAU.init((svg, S) => {
  const { W, H, el, BRAND: B } = S;
  const rc = rough.svg(svg);
  const u = H / 1080, horizon = H * .64;
  const defs = el('defs', {}, svg);
  defs.innerHTML = `
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      ${STYLE === 3 ? '<stop offset="0" stop-color="#F0A35E"/><stop offset="1" stop-color="#FBE0AE"/>'
                    : '<stop offset="0" stop-color="#E9A35C"/><stop offset=".6" stop-color="#F2C27F"/><stop offset="1" stop-color="#F6D7A0"/>'}
    </linearGradient>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="${7*u}" stdDeviation="${4*u}" flood-color="#2A1408" flood-opacity=".35"/></filter>
    <radialGradient id="glow"><stop offset="0" stop-color="#3DF5FF" stop-opacity=".55"/><stop offset="1" stop-color="#3DF5FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="fireglow"><stop offset="0" stop-color="#FFB050" stop-opacity=".45"/><stop offset="1" stop-color="#FFB050" stop-opacity="0"/></radialGradient>
    <radialGradient id="vgrad" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#1E1612" stop-opacity="0"/><stop offset="1" stop-color="#1E1612" stop-opacity="${STYLE === 3 ? .2 : .45}"/></radialGradient>`;
  el('rect', { width: W, height: H, fill: 'url(#sky)' }, svg);
  const pen = SAU.makePen(STYLE, rc, el('g', {}, svg), { seed: 3, sw: 4 * u });

  // sun + far mesas (paper style: layered bands)
  pen.ellipse(W * .74, horizon - 250 * u, 120 * u, 120 * u, '#FFE7B0', 0, { noShadow: true });
  const far = pen.group({ opacity: STYLE === 2 ? 1 : .95 });
  far.shape(`M 0 ${horizon} L ${W*.04} ${horizon-120*u} L ${W*.17} ${horizon-130*u} L ${W*.21} ${horizon-50*u} L ${W*.4} ${horizon-70*u} L ${W*.46} ${horizon-185*u} L ${W*.62} ${horizon-195*u} L ${W*.67} ${horizon-80*u} L ${W*.86} ${horizon-100*u} L ${W*.92} ${horizon-150*u} L ${W} ${horizon-140*u} L ${W} ${horizon} Z`, '#C07A4A', 3 * u);
  far.shape(`M 0 ${horizon} L ${W*.3} ${horizon-40*u} L ${W*.55} ${horizon-25*u} L ${W*.8} ${horizon-45*u} L ${W} ${horizon-20*u} L ${W} ${horizon+10*u} L 0 ${horizon+10*u} Z`, '#B06A3E', 3 * u);
  // ground
  pen.shape(`M -20 ${horizon} L ${W+20} ${horizon} L ${W+20} ${H+20} L -20 ${H+20} Z`, '#D9A566', 3 * u, { noShadow: true });
  if (STYLE !== 3) for (let i = 0; i < 12; i++) { const x = S.hash(i) * W, y = horizon + 40*u + S.hash(i + 9) * (H - horizon - 80*u); pen.stroke(`M ${x} ${y} l ${(40 + S.hash(i+3)*60)*u} 0`, '#A8713F', 3 * u); }
  else for (let i = 0; i < 6; i++) { const x = S.hash(i) * W, y = horizon + 60*u + S.hash(i + 9) * (H - horizon - 120*u); pen.ellipse(x, y, 30*u, 8*u, '#C99556', 0); }

  // mammoth (background)
  const mg = pen.group({ transform: `translate(${W * .2},${horizon + 70 * u}) scale(${.62 * u})` });
  SAU.drawMammoth(mg);
  // fire
  el('circle', { cx: W * .73, cy: H * .86, r: 260 * u, fill: 'url(#fireglow)' }, svg);
  const fg = SAU.makePen(STYLE, rc, el('g', { transform: `translate(${W * .73},${H * .88}) scale(${u})` }, svg), { seed: 50, sw: 4 });
  SAU.drawFire(fg);
  // You, holding the device
  el('circle', { cx: W * .47 + 50 * 1.3 * u, cy: H * .95 - 230 * 1.3 * u, r: 200 * u, fill: 'url(#glow)' }, svg);
  const yg = SAU.makePen(STYLE, rc, el('g', { transform: `translate(${W * .47},${H * .95}) scale(${1.3 * u})` }, svg), { seed: 70, sw: 4 });
  SAU.drawYou(yg, { variant: 'A', expr: 'shock', holding: true });

  // texture
  if (STYLE === 1) el('image', { width: W, height: H, href: S.noiseURL(960, 540, .07, 2), preserveAspectRatio: 'none' }, svg);
  if (STYLE === 2) { el('image', { width: W, height: H, href: S.noiseURL(960, 540, .13, 5, false), preserveAspectRatio: 'none', opacity: .9 }, svg); }
  el('rect', { width: W, height: H, fill: 'url(#vgrad)' }, svg);

  // HUD (same UI in all styles)
  const M = 40 * u;
  const hp = el('g', { transform: `translate(${M},${M})` }, svg);
  el('rect', { width: 440 * u, height: 150 * u, rx: 14 * u, fill: '#2A1C15', opacity: .92 }, hp);
  el('text', { x: 26*u, y: 44*u, fill: B.sand, 'font-family': B.fontUI, 'font-weight': 700, 'font-size': 22*u, 'letter-spacing': 4*u }, hp).textContent = 'YEAR';
  el('text', { x: 300*u, y: 44*u, fill: B.tech, 'font-family': B.fontMono, 'font-size': 22*u }, hp).textContent = 'DAY 1';
  el('text', { x: 24*u, y: 112*u, fill: B.bone, 'font-family': B.fontMono, 'font-weight': 700, 'font-size': 62*u }, hp).textContent = '300,000 BC';
  // style tag
  const names = { 1: 'STYLE 1 — HAND-DRAWN', 2: 'STYLE 2 — PAPER CUT-OUT', 3: 'STYLE 3 — CLEAN VECTOR' };
  const tg = el('g', { transform: `translate(${W - M - 520*u},${M})` }, svg);
  el('rect', { width: 520*u, height: 64*u, rx: 12*u, fill: B.bone }, tg);
  el('text', { x: 260*u, y: 42*u, 'text-anchor': 'middle', fill: B.ink, 'font-family': B.fontDisplay, 'font-size': 28*u }, tg).textContent = names[STYLE];
  return { update() {} };
});
</script></body></html>
