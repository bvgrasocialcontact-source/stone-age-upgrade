// EP02 · Perde 3 — 1. gün → 1. yıl (203.6 s). Zamanlar: ep02_perde3.timing.json
SAU.duration = 203.6;
SAU.init((svg, S) => {
  const { W, H, el, set, p, E, boil, BRAND: B, clamp, hash, lerp, fmt } = S;
  const rc = rough.svg(svg);
  const defs = SAU.kitDefs(svg);

    <linearGradient id="kNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1A2A"/><stop offset="1" stop-color="#2B3A4A"/></linearGradient>
    <clipPath id="kWin" clipPathUnits="userSpaceOnUse"><path id="kWinP" d="M -14 -268 L 112 -268 Q 132 -266 146 -248 L 182 -194 L -14 -194 Z"/></clipPath><radialGradient id="kHeat"><stop offset="0" stop-color="#FF9A3C" stop-opacity=".75"/><stop offset="1" stop-color="#FF9A3C" stop-opacity="0"/></radialGradient>`);

  const bg = el('g', {}, world), tree = el('g', {}, world), props = el('g', {}, world), crowdG = el('g', {}, world), behind = el('g', {}, world);
  const mk = (o, seed) => SAU.makeYou(el('g', {}, world), rc, Object.assign({ seed }, o));
  const chief = mk(SAU.CAST.chief, 31), cousin = mk(SAU.CAST.cousin, 41), grandma = mk(SAU.CAST.grandma, 51);
  const carG = el('g', {}, world); const car = SAU.makeCar(carG, rc);
  const youHead = el('g', { 'clip-path': 'url(#kWin)' }, world); const youH = SAU.makeYou(youHead, rc, Object.assign({ seed: 5 }, SAU.CAST.you));
  const you = mk(SAU.CAST.you, 6);
  const animals = el('g', {}, world), front = el('g', {}, world), fx = el('g', {}, world), notes = el('g', {}, world);
  // ================= screen layers =================
  const SCR = el('g', {}, svg);
  el('image', { width: W, height: H, href: S.noiseURL(960, 540, .07, 5), preserveAspectRatio: 'none', opacity: .55 }, svg);
  el('rect', { width: W, height: H, fill: 'url(#kVig)', opacity: .55 }, svg);
  const over = el('g', {}, svg);
  const speedo = el('g', {}, svg);
  el('rect', { x: -170, y: -56, width: 340, height: 112, rx: 14, fill: '#120C09', stroke: B.sand, 'stroke-opacity': .4, 'stroke-width': 2 }, speedo);
  el('text', { x: -150, y: -22, fill: B.sand, 'font-family': B.fontUI, 'font-weight': 700, 'font-size': 18, 'letter-spacing': 3 }, speedo).textContent = 'SPEED';
  const speedT = el('text', { x: 150, y: 36, 'text-anchor': 'end', fill: B.bone, 'font-family': B.fontMono, 'font-weight': 700, 'font-size': 56 }, speedo);
  const big = SAU.makeBigCard(svg, 84);

  const stats = SAU.makeStatPanel(hud, W - 500, 40, ['POPULATION', 'DISTANCE DRIVEN', 'TREES HIT'], 460);
  const FACTS = [
    [78.2, 85.0, 'Ostriches can sprint at about 70 km/h. They are the fastest birds on land.'],
    [154.2, 159.8, 'The oldest wooden wheel ever found is about 5,150 years old (Ljubljana Marshes).'],

  ].map(([a, b, txt]) => ({ a, b, g: SAU.makeFactCard(svg, txt, Math.min(1840, 120 + txt.length * 14.5)) }));
  const flash = el('rect', { width: W, height: H, fill: '#FFF7E6', opacity: 0 }, svg);

  const ST = [[0, 'camp'], [25.7, 'drive'], [58.3, 'race'], [85.3, 'hunt'], [109.7, 'house'], [121.3, 'cup'], [134.5, 'manual'], [160.0, 'trip'], [188.0, 'year']];
  const stageAt = t => { let s = ST[0]; for (const x of ST) if (t >= x[0]) s = x; return s; };
  const crowdXs = n => Array.from({ length: n }, (_, i) => i);

  // camp layout
  const XC = 1150; // car
  const P_CHIEF = 720, P_COUS = 470, P_GRAN = 300;
  const treeX = 1650;
  const drawTreePeople = (g, s, n, x, y, scale = 1) => { const P = pen(g, s); for (let i = 0; i < n; i++) { const a = hash(i * 3.7), b = hash(i * 9.1); const px = x + (a - .5) * 320 * scale, py = y - 250 * scale - b * 60 * scale; P.ellipse(px, py, 16 * scale, 16 * scale, i % 3 ? '#7A5038' : '#5E3A24', 2); } };

  return {
    update(t) {
      const [st0, st] = stageAt(t), lt = t - st0;
      [fx, notes, front, animals, over, props, behind].forEach(clr);
      const day = !(st === 'house' || st === 'cup');
      set(sky, { fill: day ? 'url(#kDay)' : 'url(#kNight)' });
      let cam = [W / 2, GY - 300, 1], shake = 0;
      const show = { chief: false, cousin: false, grandma: false, you: false, youHead: false, car: true, crowd: false, tree: false };
      let carO = { x: XC, y: GY, s: 1, dist: 0 };
      let speed = null;

      // ---------------- background (re-drawn per stage) ----------------
      boil(bg, (r, s, g) => {
        const P = SAU.makePen(1, r, g, { seed: s, sw: 3 });
        P.shape(`M ${-W * 3} ${horizon} Q 0 ${horizon - 60} ${W} ${horizon - 20} Q ${W * 3} ${horizon - 40} ${W * 13} ${horizon} L ${W * 13} ${H * 2} L ${-W * 3} ${H * 2} Z`, day ? '#D9A566' : '#4A4A40', 3);
        if (day) [-1600, -300, 2600, 3900, 6100, 8800, 11200, 14500, 17800, 21000].forEach((x, i) => SAU.drawAcacia(P, x, horizon + 24, .45 + (i % 2) * .15));
        else { for (let i = 0; i < 40; i++) el('circle', { cx: hash(i) * W * 3 - W, cy: hash(i + 7) * horizon * 1.3 - H * .3, r: 2 + hash(i + 3) * 2, fill: '#F3E6CF', opacity: .7 }, g); }
        SAU.drawSavannaStrip(r, s + 3, g, -W * 3, W * 13, GY + 6, day ? 1 : .6);
      }, t, .25);

      if (st === 'camp') { // 0–25.7
        show.chief = show.cousin = show.grandma = true; show.crowd = t < 17.4; show.tree = true; show.you = t < 11.9; show.youHead = t >= 12.6;
        cam = t < 11.9 ? [XC - 200, GY - 300, lerp(1.05, 1.15, p(t, 0, 11))] : t < 17.3 ? [XC, GY - 220, 1.5] : [lerp(XC, treeX, p(t, 17.6, 19.0)), GY - 330, lerp(1.2, .95, p(t, 17.6, 19.0))];
        if (t > 17.3 && t < 17.9) shake = 22;
        carO.bounce = t > 13.1 && t < 13.9 ? Math.sin(t * 40) * 4 : 0; carO.lights = t > 13.1 && t < 13.9 && Math.floor(t * 8) % 2;
        // honk text
        const hk = win(t, 17.3, 18.9, .08, .4);
        if (hk > 0) { const g = el('g', { transform: `translate(${XC + 380},${GY - 380}) rotate(-8) scale(${hk * (1 + .1 * Math.sin(t * 40))})` }, fx); el('text', { 'text-anchor': 'middle', fill: '#FFD36B', 'font-family': B.fontDisplay, 'font-size': 170, stroke: B.ink, 'stroke-width': 14, 'paint-order': 'stroke' }, g).textContent = 'HONK!'; for (let i = 0; i < 3; i++) el('path', { d: `M ${XC + 300 + i * 40} ${GY - 160} q 40 -60 0 -120`, fill: 'none', stroke: B.ink, 'stroke-width': 6, opacity: hk }, fx); }
        // gazelle leg offered by the chief
        const legK = p(t, 6.9, 7.6, E.out), drop = p(t, 10.2, 10.8, E.in);
        if (t > 6.6 && t < 17.3) { const lx = lerp(P_CHIEF + 90, XC + 300, legK), ly = GY - 200 + drop * 180; const P = pen(props, sd(t) + 3); P.shape(`M ${lx - 50} ${ly - 12} Q ${lx} ${ly - 30} ${lx + 50} ${ly - 8} L ${lx + 60} ${ly + 10} Q ${lx} ${ly + 6} ${lx - 50} ${ly + 12} Z`, '#B8694A', 3); P.ellipse(lx + 64, ly, 14, 12, '#F3E6CF', 2.5); }
        if (t > 9.4 && t < 11.8) hand(notes, XC + 300, GY - 470, '…no thanks.', p(t, 9.5, 9.8, E.back), 52, 4);
        if (t > 5.2 && t < 6.8) hand(notes, P_CHIEF, GY - 560, 'hungry?', p(t, 5.2, 5.5, E.back), 52, -3);
        // You climbs in: walk toward the door then vanish; head appears in the window
        const inK = p(t, 11.9, 12.6, E.inOut);
        you.pose({ x: lerp(XC - 380, XC - 60, inK), y: GY + 10, scale: .62, expr: t < 9 ? 'thinking' : 'smug', look: [10, 0], bob: Math.sin(t * 6) * 3, legL: inK > 0 && inK < 1 ? Math.sin(t * 14) * 20 : 0, legR: inK > 0 && inK < 1 ? -Math.sin(t * 14) * 20 : 0 }, t);
        // tree people (from 19.0)
        if (t > 18.9) { drawTreePeople(front, sd(t), Math.round(lerp(0, 28, p(t, 18.9, 20.5))), treeX, GY, 1.15); }
        if (t > 19.0) { const n = Math.round(lerp(0, 30, p(t, 18.9, 20.5))); const g = el('g', { transform: `translate(${treeX - 420},${GY - 560}) rotate(-4)` }, notes); el('rect', { x: -10, y: -54, width: 330, height: 72, rx: 10, fill: '#120C09', opacity: .9 }, g); el('text', { x: 14, y: -6, fill: B.tech, 'font-family': B.fontMono, 'font-weight': 700, 'font-size': 40, filter: 'url(#kGlow)' }, g).textContent = 'IN TREE: ' + n; }
        if (t > 22.0) hand(notes, treeX + 330, GY - 380, '← the chief', p(t, 22.0, 22.3, E.back), 44, 4);
        if (t > 23.2) hand(notes, treeX + 120, GY - 600, '↓ his grandmother', p(t, 23.2, 23.5, E.back), 44, -4);
      }

      if (st === 'drive') { // 25.7–58.3
        const fast = t >= 39.9, crash = t >= 48.2;
        const slowD = Math.max(0, t - 31.3) * 26, fastD = fast ? (t - 39.9) * 1400 : 0;
        const dist = crash ? (48.2 - 39.9) * 1400 + slowD : slowD + fastD;
        const crashX = (48.2 - 39.9) * 1400 + (48.2 - 31.3) * 26 + XC; // tree position = where the car stops
        carO = { x: XC + dist, y: GY, s: 1, dist, bounce: t > 30.3 && !crash ? Math.sin(t * 25) * (fast ? 4 : 2) : 0, dents: crash ? 2 : 0, tilt: crash ? -3 * p(t, 48.2, 48.5, E.out) : 0 };
        cam = [carO.x - 60, GY - 280, fast && !crash ? .95 : 1.05]; if (t >= 48.2 && t < 48.7) shake = 30;
        if (t > 30.3 && t < 31.3) shake = 6;
        speed = t < 31.3 ? 0 : !fast ? 3 : crash ? 0 : Math.min(60, (t - 39.9) * 60);
        show.youHead = true; show.crowd = false;
        // walkers next to the car (some faster)
        if (!fast) for (let i = 0; i < 7; i++) { const g = el('g', { transform: `translate(${XC - 300 + i * 110 + Math.max(0, t - 31.3) * (24 + (i % 3) * 8) },0)` }, behind); SAU.drawCrowd(rc, sd(t) + i, g, [0], GY - 46, .7, i % 2 ? '#7A5038' : '#6A4430'); }
        if (t > 36.8 && t < 39.8) hand(notes, carO.x + 260, GY - 470, 'some of them are faster', p(t, 36.8, 37.1, E.back), 46, -3);
        if (t > 29.0 && t < 31.3) hand(notes, carO.x, GY - 470, 'VROOOM', p(t, 30.3, 30.5, E.back), 90, -4, '#C8362E');
        if (fast && !crash) { SAU.dust(fx, carO.x - 310, GY - 10, t, 6, 1.4); SAU.speedLines(fx, carO.x - 300, GY - 120, t, 5, 260); for (let i = 0; i < 4; i++) hand(notes, carO.x - 500 - i * 140, GY - 300 - (i % 2) * 120, 'AAAH!', 1, 44, -10 + i * 6); }
        if (t > 44.9 && t < 47.0) { const g = el('g', { transform: `translate(${carO.x - 520},${GY - 560})` }, notes); el('ellipse', { rx: 200, ry: 110, fill: B.bone, stroke: B.ink, 'stroke-width': 5 }, g); const cg = el('g', { transform: 'translate(-60,40) scale(.28)' }, g); SAU.drawCarBody(pen(cg, sd(t), 8), {}); el('circle', { cx: 70, cy: -10, r: 26, fill: '#7A5038', stroke: B.ink, 'stroke-width': 4 }, g); el('text', { x: 70, y: -50, 'text-anchor': 'middle', fill: B.ink, 'font-family': '"Comic Relief"', 'font-weight': 700, 'font-size': 34 }, g).textContent = 'nom'; }
        // the only tree for 10 km
        const tg = el('g', {}, props); SAU.drawAcacia(pen(tg, sd(t) + 5), crashX + 300, GY + 6, 1.1);
        if (crash) {
          for (let i = 0; i < 3; i++) el('circle', { cx: crashX + 260 + i * 20, cy: GY - 320 - ((t * 60 + i * 30) % 120), r: 14 + i * 4, fill: '#D9D3C8', opacity: .6 }, fx);
          if (t > 47.0 && t < 49.5) { const g = el('g', { transform: `translate(${carO.x + 160},${GY - 470}) rotate(10) scale(${p(t, 48.2, 48.4, E.back)})` }, notes); el('text', { 'text-anchor': 'middle', fill: '#FFD36B', 'font-family': B.fontDisplay, 'font-size': 140, stroke: B.ink, 'stroke-width': 12, 'paint-order': 'stroke' }, g).textContent = 'BONK'; }
          if (t > 52.1) { hand(notes, crashX - 600, GY - 160, '← 10 km of nothing', p(t, 52.1, 52.4, E.back), 44, 0); hand(notes, crashX + 1000, GY - 160, 'nothing for 10 km →', p(t, 52.6, 52.9, E.back), 44, 0); }
          if (t > 54.8) drawTreePeople(front, sd(t), 12, crashX + 300, GY, 1.2);
          if (t > 55.4) hand(notes, crashX + 300, GY - 560, '(yes, THAT tree)', p(t, 55.4, 55.7, E.back), 46, 4);
        }
        if (t > 47.0 && t < 48.2) hand(notes, carO.x + 300, GY - 520, '90 seconds later…', p(t, 47.0, 47.2, E.back), 48, -2);
      }

      if (st === 'race') { // 58.3–85.3
        const end = t >= 75.1;
        const v = t < 64.5 ? 50 : t < 69.2 ? lerp(50, 70, p(t, 64.5, 69.2)) : 70;
        const dist = (t - 58.3) * 900;
        carO = { x: XC + dist, y: GY, s: 1, dist: end ? (75.1 - 58.3) * 900 : dist, bounce: end ? -60 * Math.sin(p(t, 75.1, 75.7) * Math.PI) : Math.sin(t * 25) * 3, tilt: end ? -14 * Math.sin(p(t, 75.1, 75.8) * Math.PI) : 0, dents: 2 };
        if (end) carO.x = XC + (75.1 - 58.3) * 900 + p(t, 75.1, 76) * 150;
        cam = [XC + (Math.min(t, 75.4) - 58.3) * 900 + 200, GY - 300, .92];
        speed = end ? 0 : Math.round(t < 66.7 ? 50 : t < 67.7 ? 60 : t < 69.2 ? 65 : 70);
        show.youHead = true;
        // ostrich alongside (appears 59.4), wins after the crash
        const ox = t < 59.4 ? -2000 : t < 75.1 ? carO.x + lerp(-900, 420, p(t, 59.4, 63.5, E.out)) + Math.sin(t * 2) * 40 : XC + (75.1 - 58.3) * 900 + 120 + (t - 75.1) * 900;
        const og = el('g', { transform: `translate(${ox},${GY - 50}) scale(-.95,.95) rotate(${Math.sin(t * 28) * 3})` }, behind); SAU.drawOstrich(pen(og, sd(t), 4));
        if (!end) { SAU.dust(fx, carO.x - 310, GY - 10, t, 5, 1.2); SAU.speedLines(fx, ox - 200, GY - 200, t, 4, 220); }
        if (t > 61.5 && t < 64.4) { hand(notes, ox + 40, GY - 560, 'long legs', p(t, 61.5, 61.8, E.back), 44, -4); if (t > 62.6) hand(notes, ox + 200, GY - 620, 'big eyes', p(t, 62.6, 62.9, E.back), 44, 4); if (t > 63.0) hand(notes, ox - 160, GY - 640, 'feathers', p(t, 63.0, 63.3, E.back), 44, -6); }
        const tk = win(t, 70.2, 75.0, .3, .3);
        if (tk > 0) { big.set('CAR  vs  DINOSAUR*', t > 74.2 ? '*technically' : ''); boil(big.g.firstChild, () => big.draw(rc, sd(t), 1020, 230), t, .125); set(big.g, { display: 'inline', transform: `translate(${W / 2},${H * .3}) rotate(-2) scale(${tk})` }); }
        else set(big.g, { display: 'none' });
        if (end) { const tg = el('g', {}, props); SAU.drawTermite(pen(tg, sd(t) + 7), XC + (75.1 - 58.3) * 900 + 330, GY + 6, 1.1); }
        if (t > 76.7) { hand(notes, ox, GY - 600, 'WINNER 🏆', p(t, 76.7, 77.0, E.back), 60, -4); }
      }
      if (st !== 'race') set(big.g, { display: 'none' });

      if (st === 'hunt') { // 85.3–109.7
        const dist = (t - 85.3) * 700;
        const overshoot = t > 92.8 ? p(t, 92.8, 94.6, E.out) : 0;
        carO = { x: XC + dist, y: GY, s: 1, dist, bounce: Math.sin(t * 25) * 3, dents: 2 };
        cam = [XC + dist + 300, GY - 300, .9];
        show.youHead = true;
        const herdX = XC + dist + 650;
        for (let i = 0; i < 4; i++) {
          const turned = t > 92.8;
          const gx = herdX + i * 180 + (turned ? -overshoot * (1500 + i * 60) : 0), gy = GY - 40 - (turned ? overshoot * 30 : 0);
          const gg = el('g', { transform: `translate(${gx},${gy}) scale(${turned ? -.72 : .72},.72) rotate(${Math.sin(t * 20 + i) * 4})` }, behind); SAU.drawGazelle(pen(gg, sd(t) + i, 3));
        }
        if (t > 92.8 && t < 95.3) { hand(notes, herdX + 100, GY - 520, 'TURN!', p(t, 92.8, 93.0, E.back), 80, -6, '#C8362E'); el('path', { d: `M ${carO.x - 200} ${GY + 20} q 300 -10 600 0`, stroke: '#3B2418', 'stroke-width': 10, fill: 'none', opacity: .4 }, fx); }
        if (t > 95.3 && t < 100.4) { // trunk full of meat
          const g = el('g', { transform: `translate(${carO.x - 300},${GY - 240})` }, props); const P = pen(g, sd(t) + 2); P.shape('M -60 -10 L -100 -110 L 40 -120 L 30 -10 Z', SAU.CAR.RED, 3); for (let i = 0; i < 3; i++) P.shape(`M ${-80 + i * 40} -14 q 20 -40 40 0 Z`, '#B8694A', 3); hand(notes, carO.x - 330, GY - 460, 'trunk: FULL', p(t, 97.3, 97.6, E.back), 48, -3);
        }
        if (t > 101.3 && t < 109.6) { for (let i = 0; i < 4; i++) { const a = ((t * 1.2 + i / 4) % 1); el('path', { d: `M ${carO.x + 320 + a * 400} ${GY - 260 - a * 30} q 30 60 0 120`, fill: 'none', stroke: B.ink, 'stroke-width': 6, opacity: 1 - a }, fx); } if (t < 105.3) hand(notes, carO.x + 100, GY - 520, 'VROOOM (very loud)', p(t, 101.3, 101.6, E.back), 46, -3); }
        if (t > 105.4) { const g = el('g', { transform: `translate(${W / 2},${H * .36})` }, over); el('rect', { x: -360, y: -70, width: 720, height: 140, rx: 16, fill: '#120C09', opacity: .9 }, g); el('text', { 'text-anchor': 'middle', y: -14, fill: B.sand, 'font-family': B.fontUI, 'font-weight': 700, 'font-size': 26, 'letter-spacing': 4 }, g).textContent = 'WALK TO FIND FOOD'; el('text', { 'text-anchor': 'middle', y: 48, fill: '#FF7A3D', 'font-family': B.fontMono, 'font-weight': 700, 'font-size': 60 }, g).textContent = '× 2'; }
      }

      if (st === 'house') { // 109.7–121.3 (night)
        cam = [XC, GY - 260, 1.25]; carO = { x: XC, y: GY, s: 1, dist: 0, dents: 2, lights: true };
        // heads / legs sticking out of the windows
        const P = pen(front, sd(t) + 9);
        [[-80, -230], [-40, -236], [20, -230], [70, -226], [120, -236], [-120, -214]].forEach(([x, y], i) => P.ellipse(XC + x + Math.sin(t * 6 + i) * 6, GY + y, 26, 26, i % 2 ? '#7A5038' : '#5E3A24', 2.5));
        P.shape(`M ${XC + 220} ${GY - 210} l 90 -20 l 4 22 l -90 18 Z`, '#7A5038', 2.5); P.shape(`M ${XC - 260} ${GY - 200} l -100 -10 l -2 22 l 100 8 Z`, '#5E3A24', 2.5);
        const g = el('g', { transform: `translate(${W / 2},${110})` }, over); el('rect', { x: -330, y: -60, width: 660, height: 120, rx: 14, fill: '#120C09', opacity: .9 }, g); el('text', { 'text-anchor': 'middle', y: 22, fill: B.bone, 'font-family': B.fontMono, 'font-weight': 700, 'font-size': 52 }, g).textContent = `SEATS ${t > 112.6 ? 5 : '?'} · PEOPLE ${t > 113.5 ? 30 : '?'}`;
