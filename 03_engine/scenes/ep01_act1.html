<!doctype html>
<html><head>
<link rel="stylesheet" href="../fonts/fonts.css"><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#0B0A12;overflow:hidden}svg{display:block}</style>
<script src="../vendor/rough.js"></script>
<script src="../lib/sau.js"></script><script src="../lib/pen.js"></script><script src="../lib/characters.js"></script>
<script src="../lib/animals.js"></script><script src="../lib/you.js"></script><script src="../lib/kit.js"></script>
</head><body><script>
// EP01 · Perde 1 — Kanca (0:00–0:24.5). Zamanlar: 02_audio/ep01_perde1.timing.json
SAU.duration = 24.5;
SAU.init((svg, S) => {
  const { W, H, el, set, p, tw, E, boil, BRAND: B, clamp, hash, lerp } = S;
  const rc = rough.svg(svg);
  SAU.kitDefs(svg);
  const horizon = H * .62;
  const FX = W * .6, FY = H * .86;           // campfire (world coords)
  const YX = W * .38, YY = H * .93, YS = .82; // You feet + scale

  // ================= WORLD (night camp) =================
  const world = el('g', {}, svg);
  el('rect', { x: -W, y: -H, width: W * 3, height: H * 3, fill: 'url(#kNight)' }, world);
  const stars = el('g', {}, world); SAU.drawStars(stars, W, H, 80);
  const bg = el('g', {}, world);
  const fireLight = el('circle', { cx: FX, cy: FY - 60, r: 700, fill: 'url(#kFireLight)' }, world);
  const fire = el('g', {}, world);
  const sparks = el('g', {}, world);
  const zzz = el('g', {}, world);
  const youRot = el('g', {}, world);
  const you = SAU.makeYou(youRot, rc, { seed: 5, colors: { tech: '#FBEFE2' } });
  const phoneLight = el('circle', { r: 320, fill: 'url(#kClaudeLight)', opacity: 0 }, world);
  const dark = SAU.makeDarkness(svg, W, H, '#07060C', 'm1');
  world.appendChild(dark.node);                   // darkness lives in world space
  set(dark.node, { x: -W, y: -H, width: W * 3, height: H * 3 });
  dark.node.ownerSVGElement.querySelector('#m1').setAttribute('x', -W);
  set(svg.querySelector('#m1'), { x: -W, y: -H, width: W * 3, height: H * 3 });
  set(svg.querySelector('#m1 rect'), { x: -W, y: -H, width: W * 3, height: H * 3 });
  const icons = el('g', {}, world);
  const bubble = el('g', {}, world); const bubbleRough = el('g', {}, bubble);
  const qMark = el('text', { x: 0, y: 40, 'text-anchor': 'middle', fill: B.ink, 'font-family': '"Comic Relief"', 'font-weight': 700, 'font-size': 130 }, bubble); qMark.textContent = '?';
  const callout = SAU.makeCallout(world, 'Claude', 'an AI assistant');

  // icons ("explain almost anything")
  const iconNames = ['sun', 'star', 'fish', 'leaf', 'drop', 'math', 'moon', 'atom'];
  const iconEls = iconNames.map(n => el('path', { d: SAU.ICONS[n], fill: 'none', stroke: SAU.CL.orange, 'stroke-width': 6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', filter: 'url(#kGlowWarm)' }, icons));

  // ================= CLOSE-UP (phone screen) =================
  const close = el('g', { opacity: 0 }, svg);
  el('rect', { width: W, height: H, fill: '#120E12' }, close);
  const bokeh = el('g', { filter: 'url(#kBlur)' }, close);
  for (let i = 0; i < 14; i++) el('circle', { cx: hash(i * 4.1) * W, cy: H * .45 + hash(i * 2.3) * H * .6, r: 40 + hash(i) * 90, fill: i % 3 ? '#E2572C' : '#F59B2F', opacity: .12 + hash(i * 9) * .18, class: 'bk', 'data-i': i }, bokeh);
  const phoneG = el('g', {}, close);
  const phone = SAU.makePhoneCloseup(phoneG, 560);
  const thumbs = el('g', {}, close); // fingers holding the phone
  const LINE = 'How can I help you today?';

  // ================= TODAY? flash (neon stone city) =================
  const city = el('g', { opacity: 0 }, svg);
  const cityArt = el('g', {}, city);
  const todayTag = el('g', {}, city);
  el('rect', { x: -170, y: -62, width: 340, height: 124, fill: B.tech, transform: 'rotate(3)' }, todayTag);
  el('text', { x: 0, y: 30, 'text-anchor': 'middle', fill: B.ink, 'font-family': B.fontDisplay, 'font-size': 82, transform: 'rotate(3)' }, todayTag).textContent = 'TODAY?';

  // ================= overlays =================
  el('image', { width: W, height: H, href: S.noiseURL(960, 540, .07, 3), preserveAspectRatio: 'none', opacity: .9 }, svg);
  el('rect', { width: W, height: H, fill: 'url(#kVig)' }, svg);
  const flash = el('rect', { width: W, height: H, fill: '#FFF7E6', opacity: 0 }, svg);

  // HUD
  const hud = el('g', {}, svg);
  const yp = SAU.makeYearPanel(hud, 40, 40);
  const stats = SAU.makeStatPanel(hud, W - 460, 40, ['CAMPFIRE', 'PHONE BATTERY'], 420);
  const fact = SAU.makeFactCard(svg, 'The oldest known Homo sapiens fossils are ~300,000 years old.', 1010);
  const stamp = SAU.makeStamp(svg, 'PROBLEMS:', 820, 210);
  const blackIn = el('rect', { width: W, height: H, fill: '#000' }, svg);

  // ---------- timeline helpers ----------
  const win = (t, a, b, fi = .25, fo = .25) => p(t, a, a + fi, E.out) * (1 - p(t, b - fo, b, E.in));

  return {
    update(t) {
      // ---------- camera (world) ----------
      // 0–6: wide, slow push; 5.9–6.3 dive into phone; 9.5–9.9 back; 16.6–18 push to face; 20.9 face; 22–23 pull back
      const phX = YX + 45 * YS, phY = YY - 228 * YS; // phone in hand (world)
      const headX = YX, headY = YY - 410 * YS;
      let fx = lerp(W * .5, W * .48, p(t, 0, 5.8, E.linear)), fy = H * .64, z = lerp(1.25, 1.36, p(t, 0, 5.8, E.linear));
      const dive = p(t, 5.85, 6.3, E.in);
      fx = lerp(fx, phX, dive); fy = lerp(fy, phY, dive); z = lerp(z, 7, dive);
      if (t >= 9.45) {
        const back = p(t, 9.45, 9.95, E.out);
        fx = lerp(phX, W * .49, back); fy = lerp(phY, H * .63, back); z = lerp(7, 1.36, back);
        const push = p(t, 16.5, 18.0, E.inOut);
        fx = lerp(fx, headX + 60, push); fy = lerp(fy, headY + 40, push); z = lerp(z, 2.1, push);
      }
      if (t >= 20.75) { const k = p(t, 20.75, 21.9, E.out); fx = headX + 30; fy = headY + 60; z = lerp(2.6, 2.4, k); }
      if (t >= 21.95) { const k = p(t, 21.95, 22.9, E.inOut); fx = lerp(headX + 30, W * .5, k); fy = lerp(headY + 60, H * .62, k); z = lerp(2.4, 1.22, k); }
      const shake = (t > 23.05 && t < 23.4) ? 22 : (t > 5.1 && t < 5.3 ? 8 : 0);
      SAU.cam(world, W, H, fx, fy, z, shake, t);

      // ---------- background + fire ----------
      SAU.twinkle(stars, t);
      boil(bg, (r, s, g) => SAU.drawNightCamp(r, s, g, W, H, horizon), t, .25);
      const fireK = (.55 - .2 * p(t, 0, 24, E.linear)) * (1 + .5 * p(t, 0.4, 1.4)) * (t > 20.9 && t < 21.7 ? .55 : 1) + (hash(Math.floor(t * 12)) - .5) * .06;
      boil(fire, (r, s, g) => SAU.drawCampfire(r, s, g, FX, FY, fireK), t, .083);
      SAU.sparks(sparks, FX, FY, t, 9, .5 + fireK);
      set(fireLight, { opacity: .45 + fireK * .6 + (hash(Math.floor(t * 10)) - .5) * .1 });

      // ---------- You ----------
      // lying asleep until 2.2, springs up 2.3–2.9
      const up = p(t, 2.25, 2.9, E.back);
      set(youRot, { transform: `rotate(${-90 * (1 - up)} ${YX + 30} ${YY})` });
      const asleep = t < 1.9;
      const holding = t >= 4.45;
      let expr = 'neutral', look = [0, 0], blink = asleep;
      if (t > 2.9 && t < 3.95) look = [Math.sin((t - 2.9) * 5) * 12, 0];            // looks around
      if (t >= 3.95 && t < 4.45) { look = [10, 14]; expr = 'thinking'; }             // "and in your hand"
      if (t >= 4.45 && t < 9.7) { expr = 'shock'; look = [8, 12]; }                  // "there's a phone"
      if (t >= 9.7 && t < 12.8) { expr = 'smile'; look = [8, 12]; }
      if (t >= 12.8 && t < 16.5) { expr = 'neutral'; look = [0, 0]; }                // blank stare
      if (t >= 16.5 && t < 20.75) { expr = 'thinking'; look = [-6, -6]; }
      if (t >= 20.75 && t < 22.9) { expr = 'shock'; look = [0, 0]; }
      if (t >= 22.9) { expr = 'scared'; look = [6, -10]; }
      if (!asleep && ((t > 3.4 && t < 3.5) || (t > 7.9 && t < 8.0) || (t > 14.2 && t < 14.3) || (t > 15.0 && t < 15.1) || (t > 19.4 && t < 19.5))) blink = true;
      const breathe = asleep ? Math.sin(t * 2.2) * 4 : Math.sin(t * 2.6) * 2.5;
      const hop = t > 4.45 && t < 4.75 ? -Math.sin(p(t, 4.45, 4.75, E.linear) * Math.PI) * 26 : 0;
      const bonk = t > 13.0 && t < 13.5 ? Math.sin(p(t, 13.0, 13.5, E.linear) * Math.PI) * 10 : 0;
      you.pose({ x: YX, y: YY + hop, scale: YS, holding, expr, blink, look, bob: breathe,
        armL: t < 2.3 ? 20 : (t > 4.45 && t < 9.7 ? 0 : Math.sin(t * 1.3) * 4), armR: t >= 3.95 && t < 4.45 ? 50 : 0,
        head: (asleep ? 6 : Math.sin(t * 1.1) * 2) + bonk + (t >= 12.8 && t < 16.5 ? 8 : 0), legL: 0, legR: 0 }, t);

      // zzz while sleeping
      while (zzz.firstChild) zzz.removeChild(zzz.firstChild);
      if (t < 2.2) for (let i = 0; i < 3; i++) {
        const ph = ((t * .7 + i / 3) % 1);
        const z0 = el('text', { x: YX - 470 + ph * 60 + i * 10, y: YY - 120 - ph * 160, fill: B.bone, 'font-family': '"Comic Relief"', 'font-weight': 700, 'font-size': 40 + ph * 30, opacity: (1 - ph) * (1 - p(t, 1.6, 2.1)) }, zzz);
        z0.textContent = 'z';
      }

      // phone glow (world)
      const glowK = holding ? (t < 4.8 ? p(t, 4.45, 4.8, E.out) * 1.4 : 1) * (.9 + .1 * Math.sin(t * 7)) : 0;
      set(phoneLight, { cx: phX, cy: phY, opacity: glowK });

      // darkness: lights in world space
      const lights = [{ x: FX, y: FY - 60, r: 560 + fireK * 260 + (hash(Math.floor(t * 9)) - .5) * 40, k: 1 }];
      if (holding) lights.push({ x: phX, y: phY, r: 340 * glowK, k: 1 });
      dark.update(lights, lerp(.9, .68, p(t, .3, 1.6)) * (t > 20.9 && t < 21.8 ? 1.06 : 1));

      // ---------- callout "CLAUDE" 9.75–12.6 ----------
      const cin = win(t, 9.75, 12.7, .3, .3);
      const bx = phX + 140, by = phY - 330;
      set(callout.g, { opacity: cin });
      set(callout.box, { transform: `translate(${bx},${by + (1 - p(t, 9.75, 10.1, E.back)) * 30})` });
      const lk = p(t, 9.75, 10.05, E.out);
      set(callout.line, { d: `M ${phX + 20} ${phY - 40} L ${lerp(phX + 20, bx + 30, lk)} ${lerp(phY - 40, by + 104, lk)}` });

      // ---------- icons: out of the phone 10.95–12.7, bonk his head 12.8–13.3, fall ----------
      iconEls.forEach((ic, i) => {
        const a0 = 10.95 + i * .13;
        const k = p(t, a0, a0 + .7, E.out);
        const ang = -Math.PI * (.15 + .7 * (i / (iconEls.length - 1)));
        let x = phX + Math.cos(ang) * 330 * k, y = phY - 80 + Math.sin(ang) * 260 * k + Math.sin(t * 2 + i) * 8;
        let rot = Math.sin(t * 1.5 + i) * 10, op = k;
        const hit = 12.8 + i * .06;
        if (t > hit) {
          const h1 = p(t, hit, hit + .35, E.in);              // fly to head
          const tx0 = x, ty0 = y;
          x = lerp(tx0, headX + (i - 3.5) * 14, h1); y = lerp(ty0, headY - 120, h1);
          if (t > hit + .35) {                                  // bounce off and fall
            const f = t - (hit + .35), dir = i % 2 ? 1 : -1;
            x = headX + (i - 3.5) * 14 + dir * (120 + i * 25) * f; y = headY - 120 - 260 * f + 900 * f * f; rot += f * 400 * dir;
            op = 1 - p(t, hit + .9, hit + 1.4);
          }
        }
        set(ic, { transform: `translate(${x},${y}) rotate(${rot}) scale(${.8 + .2 * k})`, opacity: op });
      });

      // ---------- question bubble 13.3–16.4 ----------
      const qb = win(t, 13.3, 16.45, .3, .25);
      boil(bubbleRough, (r, s, g) => SAU.drawQuestionBubble(r, s, g, 85), t, .125);
      set(bubble, { transform: `translate(${headX + 230},${headY - 260}) scale(${.4 + .6 * p(t, 13.3, 13.65, E.back)})`, opacity: qb });
      set(qMark, { transform: `rotate(${Math.sin(t * 3) * 6})` });

      // ---------- close-up phone 6.15–9.6 ----------
      const cl = p(t, 6.12, 6.32, E.out) * (1 - p(t, 9.45, 9.65, E.in));
      set(close, { opacity: cl, display: cl > 0 ? 'inline' : 'none' });
      if (cl > 0) {
        close.querySelectorAll('.bk').forEach(b => { const i = +b.dataset.i; b.setAttribute('opacity', .1 + .16 * (0.5 + .5 * Math.sin(t * 3 + i))); });
        boil(phone.body, (r, s) => phone.drawBody(r, s), t, .125);
        const zIn = lerp(1.35, 1, p(t, 6.12, 6.6, E.out)) * lerp(1, 1.06, p(t, 6.6, 9.5, E.linear));
        set(phoneG, { transform: `translate(${W / 2},${H / 2 + 20}) rotate(${-4 + Math.sin(t) * 1.2}) scale(${zIn * .68})` });
        const on = p(t, 6.28, 6.6, E.out);
        set(phone.ui, { opacity: on }); set(phone.glow, { opacity: .35 * on });
        phone.setBattery(100);
        const n = Math.floor(clamp((t - 7.75) / (9.2 - 7.75)) * LINE.length);
        phone.setText(LINE.slice(0, n), true, t);
        // thumbs
        boil(thumbs, (r, s, g) => {
          const P = SAU.makePen(1, r, g, { seed: s, sw: 5 }), sk = SAU.CHAR.skin;
          P.shape(`M ${W / 2 - 230} ${H + 40} Q ${W / 2 - 260} ${H * .78} ${W / 2 - 190} ${H * .66} Q ${W / 2 - 150} ${H * .62} ${W / 2 - 140} ${H * .7} Q ${W / 2 - 150} ${H * .84} ${W / 2 - 100} ${H + 40} Z`, sk);
          P.shape(`M ${W / 2 + 250} ${H + 40} Q ${W / 2 + 270} ${H * .84} ${W / 2 + 205} ${H * .74} Q ${W / 2 + 165} ${H * .7} ${W / 2 + 155} ${H * .78} Q ${W / 2 + 170} ${H * .9} ${W / 2 + 120} ${H + 40} Z`, sk);
        }, t, .125);
      }

      // ---------- TODAY? flash 18.02–20.8 ----------
      const ct = t >= 18.02 && t < 20.8;
      set(city, { opacity: ct ? 1 : 0, display: ct ? 'inline' : 'none' });
      if (ct) {
        boil(cityArt, (r, s, g) => SAU.drawStoneCity(r, s, g, W, H, t), t, .125);
        const cz = lerp(1.0, 1.08, p(t, 18.02, 20.8, E.linear));
        set(cityArt, { transform: `translate(${W / 2},${H / 2}) scale(${cz}) translate(${-W / 2},${-H / 2})` });
        set(todayTag, { transform: `translate(${W - 300},${150}) scale(${p(t, 18.2, 18.5, E.back)})` });
      }
      const fl = Math.max(1 - p(t, 18.0, 18.35, E.out), 0) * (t >= 17.95 ? 1 : 0) + (t >= 20.75 ? (1 - p(t, 20.75, 21.05, E.out)) * .8 : 0);
      set(flash, { opacity: t < 17.95 ? 0 : fl });

      // ---------- HUD ----------
      const hudOn = p(t, .5, 1.0, E.out) * (1 - p(t, 5.9, 6.1)) + p(t, 9.6, 9.9) * (1 - p(t, 17.9, 18.0));
      const hudOn2 = t > 20.9 ? p(t, 20.9, 21.2) : 0;
      set(hud, { opacity: clamp(hudOn + hudOn2), transform: `translate(0,${(1 - p(t, .5, 1.0, E.out)) * -30})` });
      yp.set('300,000 BC', t < 16.5 ? 'DAY 1' : 'DAY 1 · NIGHT');
      const firePct = clamp(fireK / 1.0) * 60;
      stats.set(0, Math.max(3, firePct).toFixed(0) + '%', firePct < 20 ? '#FF7A3D' : B.bone);
      stats.set(1, holding ? '100%' : '—', holding ? '#7CF29A' : B.bone);

      // ---------- Real Fact 1.6–5.7 ----------
      const fk = p(t, 1.6, 2.0, E.back) * (1 - p(t, 5.4, 5.75, E.in));
      set(fact, { transform: `translate(40,${H - 132 + (1 - fk) * 180})`, opacity: clamp(fk * 2) });

      // ---------- PROBLEMS stamp 23.0– ----------
      const sk = p(t, 23.0, 23.25, E.out);
      boil(stamp.g.firstChild, () => stamp.draw(rc, Math.floor(t / .125)), t, .125);
      set(stamp.g, { transform: `translate(${W / 2},${H * .3}) scale(${lerp(2.4, 1, sk)}) rotate(${-4 + (1 - sk) * 10})`, opacity: t < 23.0 ? 0 : clamp(sk * 3) });
      const roll = p(t, 23.25, 24.0, E.out);
      stamp.num.textContent = t < 24.0 ? String(Math.floor(roll * 4 + hash(Math.floor(t * 20)) * (1 - roll) * 9) % 10) : '4';

      set(blackIn, { opacity: 1 - p(t, 0, .45, E.out) });
    },
  };
});
</script></body></html>
